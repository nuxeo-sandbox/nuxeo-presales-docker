# =============================================================================
# Vector search client - semantic / hybrid search.
# Copied into ./conf/ by bootstrap.sh ONLY when the vector feature is enabled
# (i.e. when the nuxeo-search-client-opensearch2-vector package is installed).
# The vector client shares the single OpenSearch 3.7 cluster declared in
# core.conf (nuxeo.opensearch2.client.server), so it has no dedicated server.
# =============================================================================

# --- REQUIRED ---------------------------------------------------------------
# ID of the embedding model deployed on the OpenSearch cluster.
# Get it with:  ./scripts/register-embedding-model.sh
# then paste the printed model_id below and (re)start Nuxeo.
nuxeo.search.client.vector.opensearch2.model.id=HERE_THE_MODEL_ID

# --- Tuning (defaults from the PoC doc) -------------------------------------
# Vector size - MUST match the embedding model (MiniLM = 384).
nuxeo.search.client.vector.opensearch2.dimension=384
# Combine BM25 + neural (needs the opensearch-neural-search plugin, present in
# OpenSearch 3.x). Set to false for OpenSearch 2.x.
nuxeo.search.client.vector.opensearch2.hybrid=true
# Score fusion weights (favor semantic recall).
nuxeo.search.client.vector.opensearch2.bm25Weight=0.3
nuxeo.search.client.vector.opensearch2.neuralWeight=0.7
# Chunking.
nuxeo.search.client.vector.opensearch2.chunk.targetTokens=230
nuxeo.search.client.vector.opensearch2.chunk.overlapTokens=30
