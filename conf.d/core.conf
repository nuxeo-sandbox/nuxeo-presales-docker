# =============================================================================
# OpenSearch 3.7 - single cluster hosting the keyword (BM25) "main" index +
# audit AND (when the vector package is installed) the vector index.
# Property names follow the opensearch2 client shape
# (nuxeo.opensearch1.client.server -> nuxeo.opensearch2.client.server).
# =============================================================================
nuxeo.opensearch2.client.server=http://opensearch:9200
nuxeo.search.client.default.opensearch2.settings.numberOfShards=1
nuxeo.search.client.default.opensearch2.settings.numberOfReplicas=0

# MongoDB
nuxeo.mongodb.server=mongo:27017

org.nuxeo.connect.url=https://connect.nuxeo.com/nuxeo/site/
