# Optional Mailu mail-server module. Services run under the `mail` profile;
# config is in .mail.env (generated by bootstrap).

x-mailu-subnet: &mailu-subnet "192.168.203.0/24"

x-mailu-env: &mailu-env
  SUBNET: *mailu-subnet

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    profiles: ["mail"]
    volumes:
      - mailu-redis:/data

  front:
    image: ghcr.io/mailu/nginx:${MAILU_VERSION}
    restart: unless-stopped
    profiles: ["mail"]
    env_file: .mail.env
    environment:
      <<: *mailu-env
    ports:
      - "25:25"     # SMTP
      - "465:465"   # SMTPS
      - "587:587"   # submission
      - "143:143"   # IMAP
      - "993:993"   # IMAPS
      - "8081:80"   # webmail + admin UI (http)
      - "8443:443"  # webmail + admin UI (https)
    volumes:
      - mailu-certs:/certs
    depends_on:
      - admin

  admin:
    image: ghcr.io/mailu/admin:${MAILU_VERSION}
    restart: unless-stopped
    profiles: ["mail"]
    env_file: .mail.env
    environment:
      <<: *mailu-env
    volumes:
      - mailu-data:/data
      - mailu-dkim:/dkim
    depends_on:
      - redis

  imap:
    image: ghcr.io/mailu/dovecot:${MAILU_VERSION}
    restart: unless-stopped
    profiles: ["mail"]
    env_file: .mail.env
    environment:
      <<: *mailu-env
    volumes:
      - mailu-mail:/mail
    depends_on:
      - front

  smtp:
    image: ghcr.io/mailu/postfix:${MAILU_VERSION}
    restart: unless-stopped
    profiles: ["mail"]
    env_file: .mail.env
    environment:
      <<: *mailu-env
    volumes:
      - mailu-mailqueue:/queue
    depends_on:
      - front

  antispam:
    image: ghcr.io/mailu/rspamd:${MAILU_VERSION}
    hostname: antispam
    restart: unless-stopped
    profiles: ["mail"]
    env_file: .mail.env
    environment:
      <<: *mailu-env
    volumes:
      - mailu-filter:/var/lib/rspamd
    depends_on:
      - front
      - redis

  webmail:
    image: ghcr.io/mailu/webmail:${MAILU_VERSION}
    restart: unless-stopped
    profiles: ["mail"]
    env_file: .mail.env
    environment:
      <<: *mailu-env
    volumes:
      - mailu-webmail:/data
    depends_on:
      - front

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: *mailu-subnet

volumes:
  mailu-redis:
  mailu-certs:
  mailu-data:
  mailu-dkim:
  mailu-mail:
  mailu-mailqueue:
  mailu-filter:
  mailu-webmail:
